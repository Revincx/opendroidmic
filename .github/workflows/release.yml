name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libopus-dev pkg-config

      - name: Build
        working-directory: linux
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar czf opendroidmic-${VERSION}-linux-amd64.tar.gz \
            -C linux/target/x86_64-unknown-linux-gnu/release \
            opendroidmic opendroidmic-test-sender

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: opendroidmic-*-linux-amd64.tar.gz

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Keep SDK metadata compatible with the AGP 8.7 toolchain.
          cmdline-tools-version: '12266719'
          # Override the default package list, which includes the retired "tools" package.
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 cmake;3.22.1 ndk;27.0.12077973'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          test -s android/release.keystore

      - name: Build signed release APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk \
             "../opendroidmic-${VERSION}-android-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
             "../opendroidmic-${VERSION}-android-armeabi-v7a.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk \
             "../opendroidmic-${VERSION}-android-universal.apk"

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: opendroidmic-*-android-*.apk

  create-release:
    needs: [build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            linux-amd64/*.tar.gz
            android-release/*.apk
          body: |
            ## Quick Start

            ### Linux
            ```bash
            tar xzf opendroidmic-*-linux-amd64.tar.gz
            cd opendroidmic-*
            ./opendroidmic
            ```

            ### Android
            Install the APK matching your device architecture:
            - `opendroidmic-*-android-arm64-v8a.apk` — most modern phones
            - `opendroidmic-*-android-armeabi-v7a.apk` — older 32-bit phones
            - `opendroidmic-*-android-universal.apk` — works on all ARM devices

            ### Connect
            1. Start receiver: `./opendroidmic`
            2. Open app, enter PC IP + port 38471
            3. Tap Start Streaming
            4. Select OpenDroidMic as mic in your app

            ### System Requirements (Linux)
            - PipeWire 1.0+ (runtime only, for virtual mic)
            - libopus (runtime only, for Opus codec)
