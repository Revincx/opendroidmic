name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libopus-dev pkg-config

      - name: Build
        working-directory: linux
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar czf opendroidmic-${VERSION}-linux-amd64.tar.gz \
            -C linux/target/x86_64-unknown-linux-gnu/release \
            opendroidmic opendroidmic-test-sender

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: opendroidmic-*-linux-amd64.tar.gz

  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the default package list, which includes the retired "tools" package.
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Build signed ${{ matrix.abi }} APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ./gradlew assembleRelease
          cp "app/build/outputs/apk/release/app-${{ matrix.abi }}-release.apk" \
             "../opendroidmic-${VERSION}-android-${{ matrix.abi }}.apk"

      - name: Upload ${{ matrix.abi }} APK
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: opendroidmic-*-android-${{ matrix.abi }}.apk

  build-android-universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Override the default package list, which includes the retired "tools" package.
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Build signed universal APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          ./gradlew assembleRelease
          cp "app/build/outputs/apk/release/app-universal-release.apk" \
             "../opendroidmic-${VERSION}-android-universal.apk"

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: android-universal
          path: opendroidmic-*-android-universal.apk

  create-release:
    needs: [build-linux, build-android, build-android-universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            linux-amd64/*.tar.gz
            android-arm64-v8a/*.apk
            android-armeabi-v7a/*.apk
            android-universal/*.apk
          body: |
            ## Quick Start

            ### Linux
            ```bash
            tar xzf opendroidmic-*-linux-amd64.tar.gz
            cd opendroidmic-*
            ./opendroidmic
            ```

            ### Android
            Install the APK matching your device architecture:
            - `opendroidmic-*-android-arm64-v8a.apk` — most modern phones
            - `opendroidmic-*-android-armeabi-v7a.apk` — older 32-bit phones
            - `opendroidmic-*-android-universal.apk` — works on all ARM devices

            ### Connect
            1. Start receiver: `./opendroidmic`
            2. Open app, enter PC IP + port 38471
            3. Tap Start Streaming
            4. Select OpenDroidMic as mic in your app

            ### System Requirements (Linux)
            - PipeWire 1.0+ (runtime only, for virtual mic)
            - libopus (runtime only, for Opus codec)
