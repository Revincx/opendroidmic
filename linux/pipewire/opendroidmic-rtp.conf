# OpenDroidMic direct RTP/Opus source for PipeWire 1.6.9 or newer.
# Install as ~/.config/pipewire/pipewire.conf.d/90-opendroidmic-rtp.conf
# and restart the user PipeWire services.
context.modules = [
    {
        name = libpipewire-module-rtp-source
        args = {
            source.ip = "0.0.0.0"
            source.port = 38472

            sess.media = "opus"
            sess.latency.msec = 40
            sess.ignore-ssrc = true

            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]

            stream.props = {
                media.class = "Audio/Source"
                node.name = "opendroidmic-rtp"
                node.description = "OpenDroidMic RTP"
                node.always-process = true
            }
        }
    }
]
